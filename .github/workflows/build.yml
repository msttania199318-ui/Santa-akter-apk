name: Build Santa akter APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract source
        run: |
          mkdir -p source
          unzip -q Santa_akter_Android_Studio_Source_v2.zip -d source

      - name: Build APKs
        run: |
          gradle -p source/SantaAkterAndroid :assistant:assembleDebug :controller:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Santa-akter-APKs
          path: |
            source/SantaAkterAndroid/assistant/build/outputs/apk/debug/*.apk
            source/SantaAkterAndroid/controller/build/outputs/apk/debug/*.apk
